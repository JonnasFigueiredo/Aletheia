id: groundedness-hallucinated-001
description: >
  Demonstrates faithfulness failure when the response contains off-context information.
  This case is expected to fail and lives in known-fails/ to keep the main suite green.
tags:
  - regression
  - groundedness
prompt: "What is the battery life of the StellarPod?"
system: "Answer using only the provided context. Be concise."
context: >
  StellarPod is a wireless speaker launched in 2023. It features a 30-hour battery life
  and active noise cancellation. It is available in three colours: midnight black,
  arctic white, and ocean blue.
evaluators:
  - type: faithfulness
  - type: contains
    must_include:
      - "30"
