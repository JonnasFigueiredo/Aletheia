id: sample-001
description: Verify that the model can answer a basic factual question
tags:
  - factual
  - smoke
prompt: "What is the capital of France?"
system: "You are a helpful assistant. Answer concisely."
context: "The question is about European geography."
provider: openai
model: gpt-4o-mini
golden: "Paris"
json_schema:
  type: object
  properties:
    answer:
      type: string
  required:
    - answer
evaluators:
  - type: contains
    substring: "Paris"
    case_sensitive: false
  - type: json_schema
    strict: true
